name: Build gateway
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: docker build -t inference-gateway:dev .
      - name: Smoke-test gateway
        run: |
          docker run -d --name gateway -p 127.0.0.1:8080:8080 inference-gateway:dev
          curl --fail --silent --show-error --max-time 5 \
          --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 \
          http://127.0.0.1:8080/healthz
      - name: Show container details on failure
        if: failure()
        run: |
          docker ps -a --filter name=gateway
          docker logs gateway
